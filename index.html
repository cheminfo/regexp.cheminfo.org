<!doctype html>
<html lang="en">
  <head>
    <!-- Where this deployment is mounted. The build itself carries no mount —
         its assets are relative — so this is what resolves them, and what the
         page reads its own mount back off. The container rewrites it from
         BASE_PATH when it starts, which is how one image serves both this
         site's own host and a path of a shared one. It has to come before
         anything it resolves. -->
    <base href="/" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a8a" />
    <!-- The title, the description, the canonical address, the social card and
         the structured data are written here, per address, by react-cheminfo's
         prerender plugin. The page carries none of its own, so there is nothing
         to duplicate and nothing to take back out. -->
    <!--cheminfo:head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- The crawl path a visitor with no JavaScript reads: the same plugin
         writes it, with addresses relative to the <base> above so one image
         serves the site's own host and a path of a shared one alike. -->
    <!--cheminfo:body-->
  </body>
</html>
