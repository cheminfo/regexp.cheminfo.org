# Traefik deployment — requires an external Docker network named "traefik"
# (with a `websecure` entrypoint and a `letsencrypt` cert resolver).
# Copy this file to compose.yaml and run: docker compose up -d
services:
  regexp-cheminfo-org:
    image: ghcr.io/cheminfo/regexp.cheminfo.org:latest
    build: .
    networks:
      - default
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.regexp-cheminfo-org.rule=Host(`regexp.cheminfo.org`)'
      - 'traefik.http.routers.regexp-cheminfo-org.entrypoints=websecure'
      - 'traefik.http.routers.regexp-cheminfo-org.tls.certresolver=letsencrypt'
      - 'traefik.http.services.regexp-cheminfo-org.loadbalancer.server.port=80'
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

networks:
  traefik:
    external: true
